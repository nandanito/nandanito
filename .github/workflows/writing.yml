name: Latest writing

# Keeps the "Writing" list in README.md in step with the nandan.me feed.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@v1
        with:
          feed_list: "https://nandan.me/feed.xml"
          max_post_count: 5
          commit_message: "Update latest writing"
